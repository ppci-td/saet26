# yaml-language-server: $schema=https://rsalesc.github.io/rbx/schemas/Contest.json
# Add problems by running `rbx contest add`
name: Saet2026
titles:
  en: Maratona PPCI de Programação SAET 2026
statements:
- name: statement-en
  language: pt
  path: statement/contest.rbx.tex
  type: JinjaTeX
  assets:
  - statement/icpc.sty
  - statement/*.png
  - statement/instructions.tex
  joiner: {type: tex2pdf}
  override:
    configure:
    - type: rbx-tex       # Convert rbxTeX to TeX
      template: statement/template.rbx.tex
    vars:
        # Turn into false to hide time limits and memory limits in the problem statement.
        # Useful for ICPC-style contests where you distribute a separate info sheet.
      show_limits: true
- name: editorial-en
  extends: statement-en
  override:
    vars:
        # Whether to show the problem statement in the editorial.
      show_problem: false
      show_limits: true
      editorial: true
  vars:
      # Whether to render an "EDITORIAL" watermark.
    watermark: false
    editorial: true
- name: info-en
  extends: statement-en
  path: statement/info.rbx.tex
  joiner:
vars:
  year: 2026
  date: '2026-10-14'
problems:
- short_name: A
  path: problemas/vaca
- short_name: B
  path: problemas/banana
- short_name: C
  path: problemas/corredor
- short_name: D
  path: problemas/dados
- short_name: E
  path: problemas/encanador
- short_name: F
  path: problemas/fazendinha
- short_name: G
  path: problemas/duvida
- short_name: H
  path: problemas/horario
- short_name: J
  path: problemas/jornada
- short_name: K
  path: problemas/kurt
- short_name: L
  path: problemas/lobo
- short_name: M
  path: problemas/maratona
